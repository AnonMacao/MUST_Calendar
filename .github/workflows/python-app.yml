# This workflow runs every day at 06:00 in Asia/Macau.
name: Update TimeTable Everyday

env:
  USERNAME: ${{ secrets.USERNAME }}
  PASSWORD: ${{ secrets.PASSWORD }}

  ###### preferences 配置信息 ######

  # 在这里修改学期代码，用逗号分隔。
  # Set termcode here, separated by commas.
  # Example: 2502,2506
  TERM_CODES: "2609,2702"

  # 日程开始前多少分钟提醒
  # Reminder minutes before each timed event
  ALERT: "30"

  # zh_MO for Chinese, en_US for English
  LOCALE: "zh_MO"

  # Optional OA eventType whitelist; empty uses the program's safe defaults.
  OA_ALLOWED_EVENT_TYPES: ${{ vars.OA_ALLOWED_EVENT_TYPES }}


on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
      timezone: 'Asia/Macau'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12.6
      uses: actions/setup-python@v3
      with:
        python-version: "3.12.6"

    - name: setup-chromedriver
      uses: nanasess/setup-chromedriver@v2.2.2

    - name: init driver
      run: |
        export DISPLAY=:99
        chromedriver --url-base=/wd/hub &
        sudo Xvfb -ac :99 -screen 0 1280x1024x24 > /dev/null 2>&1 & # optional

        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: run mainCode
      run: |
        python ./main.py

    - name: commit
      run: |
        git config --global user.email calRobot@github.com
        git config --global user.name githubAction
        git add -A -f -- output/oa.ics
        if [ -n "$(git ls-files -- ':(glob)output/courses/*.ics')" ] || [ -n "$(find output/courses -maxdepth 1 -type f -name '*.ics' -print -quit)" ]; then
          git add -A -f -- ':(glob)output/courses/*.ics'
        fi
        if ! git diff --cached --quiet; then
          git commit -m "update"
        fi

    - name: Push changes
      uses: ad-m/github-push-action@master


